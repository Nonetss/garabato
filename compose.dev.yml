# Docker dev stack: every app runs its own hot-reload server from source and
# `docker compose watch` syncs edits into the containers (no bind mounts, so
# node_modules stays the containers' own; only named volumes for caches/data).
#
#   bun run dev        # build, start and watch (Ctrl+C stops)
#   bun run dev:down   # remove the containers
#   bun run loki:start # only Loki on 127.0.0.1:3100, for native dev
#   bun run minio:start # only MinIO on 127.0.0.1:9000 (console :9001), for native dev
#
# Documents go to the S3_ENDPOINT in .env (your own MinIO or any S3 store).
# To use the bundled MinIO in this stack instead, set COMPOSE_PROFILES=minio
# and S3_ENDPOINT=http://minio:9000 in .env.
#
# Like production, the gateway is the only service that publishes a port:
# https://localhost:4321 (local CA, HTTP/2). The apps, Loki and MinIO stay on the
# stack's private network and reach each other by service name; the
# `environment` overrides below swap .env's localhost addresses for those
# names, everything else comes from the root .env unchanged. Native dev
# (`bun run dev:local` + `bun run gateway`) uses the same ports on the host:
# run one or the other, not both.
#
# There is no database here: DATABASE_URL in .env points at a dev PostgreSQL
# that lives outside the project, on another server.
name: stack-dev

x-node-ignore: &node-ignore
  - node_modules/
  - dist/
  - .astro/
  - .turbo/

# Same image, flags and 720h retention as compose.yml's loki.
x-loki: &loki
  image: grafana/loki:3.7.7
  volumes:
    - loki_data:/loki
  command:
    - -config.file=/etc/loki/local-config.yaml
    - -validation.allow-structured-metadata=true
    - -store.retention=720h
    - -compactor.working-directory=/loki/compactor
    - -compactor.delete-request-store=filesystem
    - -compactor.retention-enabled=true
  healthcheck:
    test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  restart: unless-stopped

# Object store for documents: pgsty/silo, a MinIO build (its entrypoint maps
# `server` to the `silo` binary). The root credentials are the backend's S3
# credentials from .env, so each credential has a single name.
x-minio: &minio
  image: pgsty/silo:latest
  command: [ "server", "/data", "--console-address", ":9001" ]
  environment:
    MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
    MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
  volumes:
    - minio_data:/data
  healthcheck:
    test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/minio/health/live" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  restart: unless-stopped

# One-shot: creates S3_BUCKET once MinIO is healthy (idempotent), then exits.
# Bun's S3 client cannot create buckets. MINIO_HOST names the MinIO service.
x-minio-init: &minio-init
  image: pgsty/silo:latest
  entrypoint: [ "sh", "-c" ]
  command:
    - mc alias set local "http://$$MINIO_HOST:9000" "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "local/$$S3_BUCKET"
  environment: &minio-init-env
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    S3_BUCKET: ${S3_BUCKET}
  restart: "no"

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://backend:3000
      LOKI_URL: http://loki:3100
    expose:
      - "4320"
    depends_on:
      - backend
    # Vite's optimized-dependency cache outlives container recreation, so a
    # fresh `bun run dev` doesn't re-optimize and force a reload on the first
    # page load. Vite re-optimizes on its own when the lockfile or config
    # hash changes; `bun run dev:down -v` resets it by hand.
    volumes:
      - frontend_vite_cache:/app/apps/frontend/node_modules/.vite
    develop:
      watch:
        - action: sync
          path: ./apps/frontend/src
          target: /app/apps/frontend/src
          ignore: *node-ignore
        - action: sync
          path: ./apps/frontend/public
          target: /app/apps/frontend/public
        - action: sync
          path: ./packages/api/src
          target: /app/packages/api/src
        - action: sync
          path: ./packages/auth/src
          target: /app/packages/auth/src
        - action: sync
          path: ./packages/env/src
          target: /app/packages/env/src
        - action: sync
          path: ./packages/logger/src
          target: /app/packages/logger/src
        - action: sync+restart
          path: ./apps/frontend/astro.config.mjs
          target: /app/apps/frontend/astro.config.mjs
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./apps/frontend/package.json

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      LOKI_URL: http://loki:3100
    expose:
      - "3000"
    # With the `minio` profile, uploads need the bucket minio-init creates;
    # without it there is nothing to wait for (external store).
    depends_on:
      minio-init:
        condition: service_completed_successfully
        required: false
    develop:
      watch:
        - action: sync
          path: ./apps/backend/src
          target: /app/apps/backend/src
          ignore: *node-ignore
        - action: sync
          path: ./packages/api/src
          target: /app/packages/api/src
        - action: sync
          path: ./packages/auth/src
          target: /app/packages/auth/src
        - action: sync
          path: ./packages/cron/src
          target: /app/packages/cron/src
        - action: sync
          path: ./packages/db/src
          target: /app/packages/db/src
        - action: sync
          path: ./packages/env/src
          target: /app/packages/env/src
        - action: sync
          path: ./packages/logger/src
          target: /app/packages/logger/src
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./apps/backend/package.json

  # The only published port: https://localhost:4321 (Caddyfile.dev: local CA,
  # HTTP/2) with the production routing to the backend and to `astro dev` on
  # the private network. The CA persists in gateway_data (`bun run dev:cert`).
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile.dev
      - --adapter
      - caddyfile
    ports:
      - "4321:4321"
    environment:
      BACKEND_HTTP_UPSTREAM: backend:3000
      FRONTEND_HTTP_UPSTREAM: frontend:4320
    volumes:
      - gateway_data:/data
    depends_on:
      - backend
      - frontend
    develop:
      watch:
        - action: sync+restart
          path: ./apps/gateway/Caddyfile.dev
          target: /etc/caddy/Caddyfile.dev
        - action: sync+restart
          path: ./apps/gateway/routes.caddy
          target: /etc/caddy/routes.caddy

  # Activity log sink for the dev stack, on the private network only (the
  # apps' LOKI_URL override). Nothing waits for it.
  loki:
    <<: *loki
    container_name: stack-dev-loki
    expose:
      - "3100"

  # The same Loki for native dev (`bun run loki:start` / `loki:stop`, profile
  # `native`), published on 127.0.0.1:3100, the LOKI_URL in .env. `bun run
  # dev` never starts it; it shares loki_data, so run one or the other.
  loki-native:
    <<: *loki
    container_name: stack-dev-loki-native
    profiles:
      - native
    ports:
      - "127.0.0.1:3100:3100"

  # Optional document store for the dev stack (profile `minio`), on the
  # private network only: with it, .env sets S3_ENDPOINT=http://minio:9000.
  minio:
    <<: *minio
    container_name: stack-dev-minio
    profiles:
      - minio
    expose:
      - "9000"
      - "9001"

  minio-init:
    <<: *minio-init
    profiles:
      - minio
    environment:
      <<: *minio-init-env
      MINIO_HOST: minio
    depends_on:
      minio:
        condition: service_healthy

  # The same MinIO for native dev (`bun run minio:start` / `minio:stop`,
  # profile `native`), published on 127.0.0.1:9000 (the S3_ENDPOINT in .env)
  # and its console on 127.0.0.1:9001. It shares minio_data, so run one or
  # the other.
  minio-native:
    <<: *minio
    container_name: stack-dev-minio-native
    profiles:
      - native
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-native-init:
    <<: *minio-init
    profiles:
      - native
    environment:
      <<: *minio-init-env
      MINIO_HOST: minio-native
    depends_on:
      minio-native:
        condition: service_healthy

volumes:
  frontend_vite_cache:
  gateway_data:
  loki_data:
  minio_data:
