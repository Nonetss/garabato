# Dev only: runs the gateway on the host network in front of the natively
# running apps (`bun run dev:local`). Started with `bun run gateway`.
#
# Its HTTP site listens on :8080 (never the host's port 80) with the same
# routing as production; the normal dev URL is still Vite on :4321.
name: stack-dev

services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    container_name: stack-gateway-dev
    network_mode: host
    environment:
      GATEWAY_HTTP_PORT: "8080"
      BACKEND_HTTP_UPSTREAM: localhost:3000
      FRONTEND_HTTP_UPSTREAM: localhost:4321
